<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>LabWeft · 科研工作台</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="topbar"><div class="brand"><span class="brandmark brandmark-weft"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" aria-hidden="true" focusable="false">
<rect width="96" height="96" rx="23" fill="#123e32"/><g fill="none" stroke-linecap="round">
<path d="M28 20v56M48 20v56M68 20v56" stroke="#efc779" stroke-width="8"/>
<path d="M20 28h56M20 48h56M20 68h56" stroke="#b6dac5" stroke-width="8"/>
<path d="M28 22v12M68 22v12M48 42v12M28 62v12M68 62v12" stroke="#123e32" stroke-width="14"/>
<path d="M28 22v12M68 22v12M48 42v12M28 62v12M68 62v12" stroke="#efc779" stroke-width="8"/>
</g></svg></span><div>LabWeft<small data-i18n="brandTagline">科研工作空间 · v0.1</small></div></div><div class="topright"><span id="mode" class="pill"></span><span id="revision" class="muted"></span><div class="language-switch" role="group" aria-label="Language / 语言"><button id="lang-zh" type="button" data-lang="zh" aria-pressed="true">中文</button><button id="lang-en" type="button" data-lang="en" aria-pressed="false">English</button></div><button id="refresh" class="iconbutton" type="button" data-i18n="refresh">↻ 刷新</button></div></header>
<div id="project-switcher" class="project-switcher" hidden><strong data-i18n="switchProject">切换项目</strong><div id="project-links" role="group" aria-label="Research projects / 研究项目"></div></div>
<div class="shell">
<aside class="sidebar"><div class="eyebrow" data-i18n="workspace">工作空间</div><div id="project-name" class="project-name" data-i18n="loadingProject">正在读取项目…</div><div id="synthetic" hidden class="synthetic" data-i18n="synthetic">合成示例 · 非真实实验</div><nav id="nav"><button data-view="map" class="active"><span>⌘</span><span data-i18n="navMap">研究地图</span></button><button data-view="semantic"><span>✎</span><span data-i18n="navSemantic">研究语义</span></button><button data-view="compare"><span>▤</span><span data-i18n="navCompare">Cell 对比</span></button><button data-view="decisions"><span>◇</span><span data-i18n="navDecisions">结论与决策</span></button><button data-view="sources"><span>▧</span><span data-i18n="navSources">证据来源</span></button><button data-view="history"><span>↺</span><span data-i18n="navHistory">更新时间线</span></button></nav><div class="sidebar-note"><span class="status-dot"></span> <span data-i18n="oneWorkspace">一个对话，一个工作空间。</span><p data-i18n="sidebarNote">使用你自己的 agent。浏览地图不需要调用模型。</p><button id="copy-prompt" class="smallbtn" data-i18n="copyPrompt">复制整理指令 ↗</button></div><div class="sidebar-foot"><span data-i18n="localNote">本地记录 · 默认不上传</span><br><span id="source-count"></span></div></aside>
<main><section class="heading"><div><div class="eyebrow" data-i18n="headingEyebrow">从实验到证据</div><h1 id="page-title"></h1><p id="page-subtitle"></p></div><div class="heading-actions"><button id="export-json" class="smallbtn" data-i18n="exportJson">导出记录 JSON</button></div></section>
<section id="stats" class="stats"></section>
<div id="notice" class="notice" hidden></div>
<div class="workspace-body"><section id="content" class="content"></section><aside id="detail" class="detail"></aside></div>
<footer><span data-i18n="footer">研究记录与模型判断分开保存。扫描 ≠ 理解；图表 ≠ 科学证明。</span><span id="footer-state"></span></footer>
</main></div>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-subtitle" hidden><section><header><div><strong id="modal-title" data-i18n="evidenceSnapshot">证据快照</strong><small id="modal-subtitle"></small></div><button id="close-modal" class="iconbutton" data-i18n="close">关闭 ×</button></header><pre id="evidence-content" tabindex="0"></pre></section></div>
<div id="toast" class="toast" hidden></div>
</body></html>
